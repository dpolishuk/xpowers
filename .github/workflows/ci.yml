name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install root dependencies
        run: npm ci --silent

      - name: Install ripgrep test dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install OpenCode runtime plugin dependencies
        run: bun install --frozen-lockfile --cwd .opencode

      - name: Prepare pinned Codex routing parser
        run: |
          python3 -m venv "$RUNNER_TEMP/codex-routing-venv"
          "$RUNNER_TEMP/codex-routing-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-deps --require-hashes -r /dev/stdin <<'EOF'
          tomlkit==0.13.3 --hash=sha256:c89c649d79ee40629a9fda55f8ace8c6a1b42deb912b2a8fd8d942ddadb606b0
          EOF
          echo "PYTHON_BIN=$RUNNER_TEMP/codex-routing-venv/bin/python" >> "$GITHUB_ENV"

      - name: Run Node-based tests
        run: node --test tests/*.test.js

      - name: Run Bun Pi smoke + install checks
        run: bun test tests/pi-agent-routing.test.ts tests/install-script.test.js tests/pi-smoke.test.ts

      - name: Verify codex skill wrappers are in sync
        run: node scripts/sync-codex-skills.js --check

      - name: Run Gemini extension tests
        run: node --test .gemini-extension/tests/*.test.js

      - name: Install OpenCode plugin dependencies
        run: cd packages/opencode-plugin && npm ci --silent

      - name: Typecheck OpenCode plugin
        run: cd packages/opencode-plugin && npm run typecheck

      - name: Lint JS/TS
        run: npm run lint

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Install root dependencies
        run: npm ci --silent

      - name: Security audit
        run: npm audit --audit-level=moderate
